<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio and CV of Qiniso Mngomezulu, software engineering graduate, full stack developer and business intelligence IT intern: experience, projects, credentials and contact details."
    />
    <meta name="theme-color" content="#145da0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1420" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved or system theme before first paint to avoid a light flash in dark mode.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (error) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>Qiniso Mngomezulu | Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
